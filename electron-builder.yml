appId: eu.magiksoft.aiderdesk
productName: aider-desk
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!resources/*'
  - '!docs-site/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.aider-desk/*'
  - '!llms.txt'
  - '!packages/*'
  - '!node_modules/react-icons/**'
  - '!node_modules/mermaid/**'
  - '!node_modules/@mermaid-js/**'
  - '!node_modules/@shikijs/**'
extraResources:
  - from: ./resources/connector
    to: connector
    filter:
      - '**/*'
  - from: ./resources/prompts
    to: prompts
    filter:
      - '**/*'
  - from: ./resources/skills
    to: skills
    filter:
      - '**/*'
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
win:
  executableName: aider-desk
  icon: resources/icon.png
  extraResources:
    - from: ./resources/win
      to: win
      filter:
        - '**/*'
nsis:
  guid: 248d54d3-da7f-5bcb-829a-a91319f53cf3
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  target:
    - target: default
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  type: distribution
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
  gatekeeperAssess: false
  notarize: true
  extraResources:
    - from: ./resources/macos
      to: macos
      filter:
        - '**/*'
dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}
linux:
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: Magiksoft s.r.o.
  category: Utility
  extraResources:
    - from: ./resources/linux
      to: linux
      filter:
        - '**/*'
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  compression: 'gz'
npmRebuild: true
publish:
  provider: github
  owner: magiksoft
  repo: aider-desk
  releaseType: draft
  vPrefixedTagName: true
  publishAutoUpdate: true
